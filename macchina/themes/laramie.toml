# laramie — tokyo night derived, hand-kept to match every other laramie theme on this machine.
# see the repo CLAUDE.md for the full list; changing a core hex means changing all of them.
#
# macchina accepts three colour syntaxes — hex "#7aa2f7", indexed "046", and named "Blue".
# hex is used throughout so the palette is exact rather than at the mercy of the terminal's
# 0-15 mapping, matching how the delta and btop themes are written.

spacing = 1
padding = 0

# the ascii logo. small, because the readout block is the point and the full apple logo
# pushes it off a narrow split.
hide_ascii = false
prefer_small_ascii = true

separator = "→"

key_color = "#7aa2f7"
separator_color = "#414868"

[box]
border = "rounded"
visible = true

[box.inner_margin]
x = 2
y = 1

[bar]
# off: the numeric readouts are more useful than a bar at this width, and memory/disk are
# already shown as percentages by macchina.toml.
visible = false
glyph = "•"
symbol_open = "("
symbol_close = ")"
hide_delimiters = true

[palette]
# the 8-colour strip along the bottom. "Full" shows normal + bright, which is the quickest
# visual check that a terminal theme is actually applied.
type = "Full"
glyph = "  "
visible = true

[keys]
host = "Host"
machine = "Machine"
kernel = "Kernel"
os = "OS"
de = "DE"
wm = "WM"
terminal = "Term"
shell = "Shell"
packages = "Packages"
uptime = "Uptime"
resolution = "Display"
backlight = "Brightness"
cpu = "CPU"
cpu_load = "Load"
memory = "Memory"
disk_space = "Disk"
