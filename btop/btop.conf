#? Config file for btop v. 1.4.7
#
# only non-default keys are set here, so a save from inside btop has the least to overwrite.
# ⚠ btop writes this file back when a setting is changed from its own options menu, and that
# write emits btop's own comment style — hand comments below would not survive it. a clean
# `q` quit with nothing changed leaves the file untouched (verified on 1.4.7: byte-identical
# and mtime unchanged), so editing here and quitting normally is safe.
#
# themes/laramie.theme is hand-kept; see the repo CLAUDE.md for the other seven copies.

# themes/laramie.theme. btop resolves a bare name against ~/.config/btop/themes first.
color_theme = "laramie"

# ⚠ false, not true: `true` paints theme[main_bg] as an opaque rectangle. the laramie theme
# leaves main_bg empty so ghostty's background-opacity = 0.85 and background-blur show through,
# and this is the switch that actually honours that.
theme_background = False

# gradients and the laramie hexes need 24-bit; ghostty provides it.
truecolor = True
