# git hooks for the dotfiles repo.
#
# ⚠ hooks are NOT installed by cloning — `.git/hooks` is never version-controlled. run
#   `lefthook install` once per clone; scripts/bootstrap.sh does it for you.
#
# why lefthook and not core.hooksPath: setting core.hooksPath disables .git/hooks entirely
# and breaks any other tool that installs one. why not pre-commit: it needs python + a venv
# per hook, which is a bootstrap-ordering problem in the repo whose job is to bootstrap the
# machine.

pre-commit:
  parallel: true
  jobs:
    # 1. secret CONTENT in the staged diff. this is the layer that catches a token written
    #    *into* an already-allowlisted file, which .gitignore can never help with.
    #    --redact so a hit is reported without echoing the credential into the terminal.
    - name: secrets
      run: |
        if ! command -v betterleaks >/dev/null 2>&1; then
          echo "✗ betterleaks is not installed — commit blocked." >&2
          echo "  brew install betterleaks   (it is declared in ./Brewfile)" >&2
          exit 1
        fi
        betterleaks git --pre-commit --staged --redact --no-banner --log-level warn

    # 2. force-add guard. .gitignore is an allowlist, so anything it excludes was excluded
    #    deliberately; a staged path that matches an ignore rule can only have arrived via
    #    `git add -f`.
    #    ⚠ --no-index is required: without it, staged (already-indexed) paths never match.
    #    ⚠ do NOT add --verbose here. with -v, check-ignore exits 0 when a path matches ANY
    #      pattern *including a negation* — so `!/​.gitignore` counted as a hit and this job
    #      failed every legitimate commit. without -v it prints only genuinely ignored paths.
    #    ⚠ --diff-filter=d (lower-case = exclude) drops deletions. untracking a directory is done
    #      by removing its `!` line, which makes every path in that same commit newly ignored —
    #      without this the guard made `!/macchina/` impossible to retire without --no-verify.
    - name: no-force-added-ignored-files
      run: |
        offenders=$(git diff --cached --name-only --diff-filter=d | git check-ignore --no-index --stdin || true)
        if [ -n "$offenders" ]; then
          echo "✗ these staged paths are excluded by .gitignore:" >&2
          printf '%s\n' "$offenders" | sed 's/^/    /' >&2
          echo "  this repo is an allowlist. if the file really belongs, add a '!' rule" >&2
          echo "  to .gitignore instead of using 'git add -f'." >&2
          exit 1
        fi

    # 3. fish must parse and be canonically formatted. mirrors claude-code/hooks/fish-validate.sh
    #    so a human commit is held to the same bar as an agent edit.
    - name: fish-syntax
      glob: "*.fish"
      run: |
        command -v fish >/dev/null 2>&1 || { echo "✗ fish not found" >&2; exit 1; }
        for file in {staged_files}; do
          # generated completions are tracked as symlinks into app/homebrew-owned files.
          # validate authored files only; formatting a symlink would mutate its owner.
          [ -L "$file" ] && continue
          fish -n "$file" || exit 1
          fish_indent --check "$file" || {
            echo "✗ not canonically formatted — run: fish_indent -w $file" >&2
            exit 1
          }
        done

    # 4. markdown is FORMATTED, never rejected. this is the only commit-time job here that
    #    rewrites your work instead of refusing it: rumdl fixes the file and `stage_fixed`
    #    puts the result back in the index, so a commit never fails on a ragged table or an
    #    over-long line. the same rumdl, the same ~/.config/.rumdl.toml, as the editor and
    #    the agent hook — this is just the net for an edit that reached the index without
    #    passing either.
    #    ⚠ `fmt` not `check --fix`: fmt exits 0 even when something is left unfixable, which
    #      is what keeps this job incapable of blocking a commit.
    #    ⚠ rumdl still honours .rumdl.toml's exclude list for explicitly-passed paths, so
    #      staged vendored markdown is passed over rather than rewritten.
    #    ⚠ PARTIAL STAGING of an UNFORMATTED file will fail this hook — verified 2026-09-12.
    #      lefthook hides the unstaged remainder, this job reformats the staged copy, and the
    #      hidden patch then no longer applies: "Unable to restore previously hidden unstaged
    #      changes". lefthook DISCARDS that remainder, so unstaged edits to other files are
    #      lost. format the working tree BEFORE staging (`rumdl fmt .`), not after.
    #    ⚠ deliberately NOT the official rumdl-pre-commit hooks. that repo targets the
    #      `pre-commit` framework, which this repo rejected on purpose (see the header): it
    #      needs python + a venv per hook, in the repo whose job is to bootstrap the machine.
    - name: markdown-format
      glob: "*.md"
      run: |
        command -v rumdl >/dev/null 2>&1 || exit 0
        rumdl fmt --silent -- {staged_files}
      stage_fixed: true

    # 5. the Brewfile is ruby. a syntax error there breaks `brew bundle` on a fresh machine,
    #    which is the one moment you cannot afford it.
    - name: brewfile-syntax
      glob: "Brewfile"
      run: ruby -c {staged_files} >/dev/null

pre-push:
  jobs:
    # full-history scan. push protection at GitHub is pattern-based and high-confidence only,
    # so this is the last local net before anything becomes public and permanent.
    - name: secrets-full-history
      run: |
        command -v betterleaks >/dev/null 2>&1 || { echo "✗ betterleaks not installed" >&2; exit 1; }
        betterleaks git --redact --no-banner --log-level warn
