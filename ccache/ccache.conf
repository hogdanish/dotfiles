# ccache — compiler cache. installed 2026-08-06 for ~/Projects/hogdot (a Godot engine
# fork, ~14,000 files of C++, rebuilt after every ported hunk). Godot's SConstruct does
# not pick this up automatically: builds need the compiler-launcher option plus exported
# CCACHE_DIR/CCACHE_CONFIGPATH values named in `import_env_vars`. the project's
# `build-export` skill owns the exact invocation.
#
# ⚠ paths are deliberately absent. ccache >= 4.0 is XDG-native on its own:
#   config -> $XDG_CONFIG_HOME/ccache/ccache.conf  (this file)
#   cache  -> $XDG_CACHE_HOME/ccache
# so there is no global CCACHE_DIR/CCACHE_CONFIGPATH block in fish/conf.d/xdg-apps.fish,
# and none should be added. export them only for the SCons process described above.
# verified with `ccache --show-config` before writing this.

# the only real change from stock. the 5 GiB default is sized for ordinary projects; one
# cold Godot build alone lands in the multi-GB range, and hogdot juggles several targets
# (macos editor, web template_debug/template_release, tests=yes). at 5 GiB the cache
# thrashes and the hit rate collapses to near zero, which is the whole reason to install
# ccache in the first place. this is a cap, not an allocation — it only fills as used.
max_size = 30G

# ── deliberately left at defaults, with the reasoning, so nobody re-litigates it ──
#
# sloppiness — NOT set. the tempting entry is `time_macros`, which lets ccache reuse
#   objects compiled from sources using __DATE__/__TIME__. Godot embeds build info, so
#   this trades correctness for hit rate. leave it off unless a measured hit rate proves
#   it necessary, and then set it knowingly.
# base_dir — NOT set. it rewrites absolute paths to relative so one cache serves several
#   checkouts (useful if the port ever uses git worktrees), but debug info then points at
#   whichever location cached the object first. turn it on only if worktrees appear.
# compression — already on by default (zstd), and worth keeping: it raises effective
#   capacity well past the 30G nominal cap for a few percent of CPU.
