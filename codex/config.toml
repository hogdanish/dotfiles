notify = [ "/Users/ethan/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended" ]
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
model_reasoning_summary = "auto"
personality = "pragmatic"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
service_tier = "default"
developer_instructions = """
When delegation is explicitly requested or applicable project instructions call for it, keep the
agent tree at most two levels below the primary: a primary may spawn subagents, and a subagent may
spawn grandchildren for bounded independent work, but grandchildren must not delegate. All
descendants share the configured concurrency ceiling; treat it as headroom, not a target. Normally
use no more than four workers at once unless the user explicitly asks for more.
"""

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/ethan/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/ethan/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[marketplaces.firecrawl]
source_type = "git"
source = "https://github.com/firecrawl/firecrawl-claude-plugin.git"
ref = "cf966ed"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

# cloudflare tooling is gated behind the launch wrapper's --infra flag
# (fish/functions/wrappers/codex.fish re-enables both via `-c` overrides)
[plugins."cloudflare@openai-curated"]
enabled = false

[plugins."cloudflare@openai-curated".mcp_servers.cloudflare-api]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."firecrawl@firecrawl"]
enabled = true

[features]
js_repl = false
memories = true

# Keep large reviews capable but bounded. Prompts should normally use no more
# than four workers at once; this ceiling leaves room for targeted follow-ups.
[agents]
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/ethan/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/ethan/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "0"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = "Control desktop apps on macOS through Computer Use."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.825.51511"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/ethan/.codex/plugins/cache/openai-bundled/browser/26.825.51511/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
startup_timeout_sec = 30
default_tools_approval_mode = "auto"

[mcp_servers.cloudflare-api]
url = "https://mcp.cloudflare.com/mcp"
auth = "oauth"
startup_timeout_sec = 30
default_tools_approval_mode = "writes"
# gated behind --infra, with the cloudflare plugin above
enabled = false

# the website specification — https://specification.website/mcp/
# stateless streamable http, no auth, read-only: search / list_topics / get_topic /
# get_checklist / get_categories / get_changes, plus an audit_url prompt.
# declared globally, off by default: most projects here are not web projects, and the
# `website-spec` skill vendors the whole checklist, so an audit never depends on this.
# each project's own .codex/config.toml turns it on: hogdot and commongrounds today.
[mcp_servers.website-spec]
url = "https://mcp.specification.website/mcp"
startup_timeout_sec = 30
default_tools_approval_mode = "auto"
enabled = false

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = [ "mcp" ]
cwd = "."
enabled = false

[mcp_servers.cua_repl]
command = "/Applications/ChatGPT.app/Contents/MacOS/ChatGPT"
enabled = false

[shell_environment_policy.set]
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "7fe0e1c59da4bc68f9d6ab81ae8d349b53fee44b074f49be0effbc1105a5f1d3"

[desktop]
external-agent-import-sync-enabled = true
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
preventSleepWhileRunning = true
show-context-window-usage = true
