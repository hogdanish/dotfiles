# gpg-agent — the touch id pinentry chain.
#
#   gpg -> gpg-agent -> pinentry-touchid -> (keychain, guarded by touch id)
#                                        \-> pinentry-mac  (fallback: key creation,
#                                            passphrase change, or no keychain entry yet)
#
# without this line gpgconf resolves pinentry to /opt/homebrew/opt/pinentry/bin/pinentry,
# which is a symlink to pinentry-curses — a TTY prompt with no touch id and no GUI.
#
# ⚠ never run `pinentry-touchid -fix`. it deletes whatever path gpgconf reports and symlinks it
# to pinentry-mac; here that path belongs to the `pinentry` formula, so -fix corrupts the install.
# setting pinentry-program explicitly is the whole fix.
pinentry-program /opt/homebrew/bin/pinentry-touchid

# cache generously. the passphrase is already recoverable from the keychain behind touch id, so
# a longer ttl trades a touch id tap for wall-clock time, not security.
default-cache-ttl 3600
max-cache-ttl 28800

# ⚠ never set no-allow-external-cache — pinentry-touchid only takes the touch id path when
# AllowExtPasswdCache is true; without it every request falls through to pinentry-mac.
# ⚠ never set enable-ssh-support — 1password owns ssh here and would fight for SSH_AUTH_SOCK.
