# Local Claude Code and Codex workspaces in Ghostty.
onboarding = false

[terminal]
# No default_shell: fish is the login shell as of 2026-09-12. Herdr resolves the shell through
# portable_pty::cmdbuilder, whose chain is $SHELL, then the passwd entry, then /bin/sh - the passwd
# entry is fish, so pinning it here would only be a second place to keep in sync.
# The catch, found 2026-09-12: $SHELL is inherited and nothing re-reads passwd after login, so the
# pre-chsh /bin/zsh survived in the GUI session (Ghostty starts fish through `login -flp`, and -p
# preserves the environment) and every new Herdr pane opened zsh. fish/conf.d/_init.fish now
# exports $SHELL from the running fish, which fixes it at the source rather than per tool.
# shell_mode stays: it is orthogonal to which shell, and login mode is what makes fish run
# path_helper over /etc/paths.d.
shell_mode = "login"
new_cwd = "follow"
kitty_graphics = true

[theme]
# Inherit Ghostty's Laramie ANSI palette.
name = "terminal"
auto_switch = false

[theme.custom]
# ANSI black is Laramie's sunken surface; ANSI bright black is a text color.
active_row_bg = "black"
selection_bg = "black"

[ui]
# Keep Herdr's mouse UI, but let a drag stay a selection until Ctrl+C/Cmd+C copies it.
copy_on_select = false
sidebar_width = 30
sidebar_max_width = 36
agent_panel_sort = "priority"
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.sound]
enabled = false

[ui.sidebar]

[ui.sidebar.agents]
row_gap = 0 # herdr-agent-quota
# ⚠ Sidebar token `fg` accepts only hex, never an ANSI name, so the severity colours are
# spelled out: laramie state.ok / state.warn / state.error. Running the quota plugin's
# configure or repair action regenerates this line with the plugin's own palette - review
# `git diff -- herdr/config.toml` afterward and restore these three values.
rows = [["state_icon", "machine", "workspace", "tab"], [{ token = "$quota_provider_model", bold = true, dim = false }], [{ token = "$quota_cache_ttl", bold = false, dim = false }, { token = "$quota_error", fg = "#e0a332", bold = false, dim = false }], [{ token = "$quota_context", bold = false, dim = false }, { token = "$quota_week_inline_normal", fg = "#86c452", bold = false, dim = false }, { token = "$quota_week_inline_warning", fg = "#e0a332", bold = false, dim = false }, { token = "$quota_week_inline_danger", fg = "#fc8697", bold = false, dim = false }, { token = "$quota_week_inline_unknown", bold = false, dim = false }], [{ token = "$quota_5h_normal", fg = "#86c452", bold = false, dim = false }, { token = "$quota_5h_warning", fg = "#e0a332", bold = false, dim = false }, { token = "$quota_5h_danger", fg = "#fc8697", bold = false, dim = false }, { token = "$quota_5h_unknown", bold = false, dim = false }, { token = "$quota_week_normal", fg = "#86c452", bold = false, dim = false }, { token = "$quota_week_warning", fg = "#e0a332", bold = false, dim = false }, { token = "$quota_week_danger", fg = "#fc8697", bold = false, dim = false }, { token = "$quota_week_unknown", bold = false, dim = false }]] # herdr-agent-quota-row
# clauth: `$clauth` renders WHICH ACCOUNT each Claude Code pane is spending. It is invisible
# until a row template names it, which is why this table exists at all.
#
# ⚠ HAND-MERGED, and it has to be. `clauth herdr install` writes a rows_by_agent.claude of its
# own - ["state_icon","workspace","tab"], ["terminal_title_stripped"], ["agent","$clauth"] - and
# rows_by_agent REPLACES the generic `rows` for that agent. Taking it verbatim would silently drop
# every herdr-agent-quota token from Claude panes, which is the half that shows usage. So this is
# the generic `rows` above, verbatim, with `$clauth` added to the model row.
#
# ⚠ MAINTENANCE: agent-quota's `configure --apply` rewrites only the line it marks
# `# herdr-agent-quota-row`, and clauth only rewrites blocks it marked itself. Neither will ever
# touch this one. After a quota-plugin update that renames or adds a token, re-copy `rows` here
# and re-add `$clauth`. scripts/audit-config.fish fails if the two drift apart.
#
# Codex panes are not listed, so they keep the generic `rows` - clauth has no account to report
# for them.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], [{ token = "$quota_provider_model", bold = true, dim = false }, { token = "$clauth", bold = false, dim = true }], [{ token = "$quota_cache_ttl", bold = false, dim = false }, { token = "$quota_error", fg = "#e0a332", bold = false, dim = false }], [{ token = "$quota_context", bold = false, dim = false }, { token = "$quota_week_inline_normal", fg = "#86c452", bold = false, dim = false }, { token = "$quota_week_inline_warning", fg = "#e0a332", bold = false, dim = false }, { token = "$quota_week_inline_danger", fg = "#fc8697", bold = false, dim = false }, { token = "$quota_week_inline_unknown", bold = false, dim = false }], [{ token = "$quota_5h_normal", fg = "#86c452", bold = false, dim = false }, { token = "$quota_5h_warning", fg = "#e0a332", bold = false, dim = false }, { token = "$quota_5h_danger", fg = "#fc8697", bold = false, dim = false }, { token = "$quota_5h_unknown", bold = false, dim = false }, { token = "$quota_week_normal", fg = "#86c452", bold = false, dim = false }, { token = "$quota_week_warning", fg = "#e0a332", bold = false, dim = false }, { token = "$quota_week_danger", fg = "#fc8697", bold = false, dim = false }, { token = "$quota_week_unknown", bold = false, dim = false }]]


[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/Projects/herdr-worktrees"

[experimental]
pane_history = false

[keys]
# Keep native config reload on prefix+shift+r.

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "herdr-agent-quota.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-quota.open-settings"
description = "open agent quota settings"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "clauth.open"
description = "clauth accounts"
